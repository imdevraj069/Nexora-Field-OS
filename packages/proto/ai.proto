syntax = "proto3";

package nexora.ai;

service AiGovernanceService {
  rpc GenerateProjectBlueprint (ProjectBlueprintRequest) returns (ProjectBlueprintResponse);
  rpc ComputeStageEfficiency (StageEfficiencyRequest) returns (StageEfficiencyResponse);
  rpc AnalyzeProjectProgress (ProjectProgressAnalysisRequest) returns (ProjectProgressAnalysisResponse);
}

message ProjectProgressAnalysisRequest {
  string org_id = 1;
  string project_id = 2;
  string user_id = 3;
}

message ProjectProgressAnalysisResponse {
  string project_id = 1;
  double overall_health_score = 2;
  double completion_percentage = 3;
  int32 total_tasks = 4;
  int32 completed_tasks = 5;
  int32 pending_checklists = 6;
  int32 total_files_submitted = 7;
  repeated string identified_languages = 8;
  repeated string voice_transcripts = 9;
  repeated string risk_flags = 10;
  string executive_summary = 11;
  string recommendations = 12;
}

message ProjectBlueprintRequest {
  string org_id = 1;
  string prompt = 2;
  string industry_hint = 3;
}

message GeneratedTask {
  string title = 1;
  string description = 2;
  repeated string checklist_items = 3;
  int32 estimated_hours = 4;
}

message GeneratedStage {
  string name = 1;
  int32 order_index = 2;
  repeated GeneratedTask tasks = 3;
  string recommended_role = 4;
}

message ProjectBlueprintResponse {
  string suggested_title = 1;
  string summary = 2;
  repeated GeneratedStage stages = 3;
}

message StageEfficiencyRequest {
  string org_id = 1;
  string project_id = 2;
  string stage_id = 3;
}

message StageEfficiencyResponse {
  double efficiency_score = 1;
  double completion_rate = 2;
  repeated string risk_flags = 3;
  string summary = 4;
}
