<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Orange gradient background matching splash screen -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff3b30"/>
      <stop offset="0.55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="28" y1="72" x2="72" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff7f0" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Rounded square bg - orange gradient (matches splash screen) -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <!-- Inner subtle highlight -->
  <rect x="1" y="1" width="98" height="98" rx="21" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <!-- N-mark (Nexora brand) in white -->
  <path d="M28 72L50 28L72 72H56L50 58L44 72H28Z" fill="url(#markGrad)"/>
  <circle cx="50" cy="46" r="4.5" fill="#ffffff"/>
</svg>
