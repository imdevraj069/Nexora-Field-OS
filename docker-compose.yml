networks:
  edge-net:
    driver: bridge
  apps-net:
    driver: bridge
  messaging-net:
    driver: bridge
  storage-net:
    driver: bridge
  data-net:
    driver: bridge

volumes:
  minio_data:
  rabbitmq_data:
  pg_dev_data:
  mongo_dev_data:
  redis_dev_data:
  pg_global_data:
  pg_backup_data:
  pg_s1_data:
  pg_s2_data:
  pg_s3_data:
  mongo_s1_data:
  mongo_s2_data:
  mongo_s3_data:

services:
  # ============================================================================
  # EDGE & CLOUDFLARE TUNNEL
  # ============================================================================
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: nexora-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - edge-net

  nginx:
    image: nginx:1.27-alpine
    container_name: nexora-nginx
    restart: unless-stopped
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - gateway-service
      - identity-service
      - storage-service
      - web
    networks:
      - edge-net

  # ============================================================================
  # OBJECT STORAGE & MESSAGING
  # ============================================================================
  minio:
    image: pgsty/minio:latest
    container_name: nexora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexoraadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexoraadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - storage-net

  minio-init:
    image: pgsty/minio:latest
    container_name: nexora-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nexoraadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexoraadmin123}
      MINIO_STORAGE_ACCESS_KEY: ${MINIO_STORAGE_ACCESS_KEY:-nexora-storage-svc}
      MINIO_STORAGE_SECRET_KEY: ${MINIO_STORAGE_SECRET_KEY:-nexora-storage-secret-123}
    volumes:
      - ./cores/minio/init-minio.sh:/init-minio.sh:ro
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    networks:
      - storage-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nexora-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nexora_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nexora_mq_pass}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - messaging-net

  # ============================================================================
  # DATA LAYER — DEV PROFILE
  # ============================================================================
  pg-dev:
    profiles: ["dev"]
    image: postgres:16-alpine
    container_name: nexora-pg-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-nexora}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexora_pass}
      POSTGRES_DB: postgres
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
      - ./cores/postgres/01-global-schema.sql:/opt/nexora-sql/01-global-schema.sql:ro
      - ./cores/postgres/02-shard-schema.sql:/opt/nexora-sql/02-shard-schema.sql:ro
      - ./cores/postgres/03-dev-bootstrap.sh:/docker-entrypoint-initdb.d/03-dev-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-nexora}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-net

  mongo-dev:
    profiles: ["dev"]
    image: mongo:7
    container_name: nexora-mongo-dev
    restart: unless-stopped
    volumes:
      - mongo_dev_data:/data/db
      - ./cores/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-net

  redis-dev:
    profiles: ["dev"]
    image: redis:7.4-alpine
    container_name: nexora-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - data-net

  # ============================================================================
  # DATA LAYER — CLUSTER PROFILE
  # ============================================================================
  pg-global:
    profiles: ["cluster"]
    image: postgres:16-alpine
    container_name: nexora-pg-global
    environment:
      POSTGRES_USER: ${PG_USER:-nexora}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexora_pass}
      POSTGRES_DB: nexora_global
    volumes:
      - pg_global_data:/var/lib/postgresql/data
      - ./cores/postgres/01-global-schema.sql:/docker-entrypoint-initdb.d/01-global-schema.sql:ro
    networks:
      - data-net

  pg-shard1:
    profiles: ["cluster"]
    image: postgres:16-alpine
    container_name: nexora-pg-shard1
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_USER: ${PG_USER:-nexora}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexora_pass}
      POSTGRES_DB: nexora_s1
    volumes:
      - pg_s1_data:/var/lib/postgresql/data
      - ./cores/postgres/02-shard-schema.sql:/docker-entrypoint-initdb.d/02-shard-schema.sql:ro
    networks:
      - data-net

  pg-shard2:
    profiles: ["cluster"]
    image: postgres:16-alpine
    container_name: nexora-pg-shard2
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_USER: ${PG_USER:-nexora}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexora_pass}
      POSTGRES_DB: nexora_s2
    volumes:
      - pg_s2_data:/var/lib/postgresql/data
      - ./cores/postgres/02-shard-schema.sql:/docker-entrypoint-initdb.d/02-shard-schema.sql:ro
    networks:
      - data-net

  pg-shard3:
    profiles: ["cluster"]
    image: postgres:16-alpine
    container_name: nexora-pg-shard3
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_USER: ${PG_USER:-nexora}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexora_pass}
      POSTGRES_DB: nexora_s3
    volumes:
      - pg_s3_data:/var/lib/postgresql/data
      - ./cores/postgres/02-shard-schema.sql:/docker-entrypoint-initdb.d/02-shard-schema.sql:ro
    networks:
      - data-net

  pg-backup:
    profiles: ["cluster"]
    image: postgres:16-alpine
    container_name: nexora-pg-backup
    environment:
      POSTGRES_USER: ${PG_USER:-nexora}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexora_pass}
      POSTGRES_DB: nexora_backup
    volumes:
      - pg_backup_data:/var/lib/postgresql/data
      - ./cores/postgres/02-shard-schema.sql:/docker-entrypoint-initdb.d/02-shard-schema.sql:ro
    networks:
      - data-net

  mongo-shard1:
    profiles: ["cluster"]
    image: mongo:7
    container_name: nexora-mongo-shard1
    volumes:
      - mongo_s1_data:/data/db
    networks:
      - data-net

  mongo-shard2:
    profiles: ["cluster"]
    image: mongo:7
    container_name: nexora-mongo-shard2
    volumes:
      - mongo_s2_data:/data/db
    networks:
      - data-net

  mongo-shard3:
    profiles: ["cluster"]
    image: mongo:7
    container_name: nexora-mongo-shard3
    volumes:
      - mongo_s3_data:/data/db
    networks:
      - data-net

  redis-global:
    profiles: ["cluster"]
    image: redis:7.4-alpine
    container_name: nexora-redis-global
    networks:
      - data-net

  redis-shard1:
    profiles: ["cluster"]
    image: redis:7.4-alpine
    container_name: nexora-redis-shard1
    networks:
      - data-net

  redis-shard2:
    profiles: ["cluster"]
    image: redis:7.4-alpine
    container_name: nexora-redis-shard2
    networks:
      - data-net

  redis-shard3:
    profiles: ["cluster"]
    image: redis:7.4-alpine
    container_name: nexora-redis-shard3
    networks:
      - data-net

  # ============================================================================
  # APPLICATION MICROSERVICES (Multi-Stage Standalone Builds)
  # ============================================================================
  identity-service:
    image: ${NEXORA_REGISTRY:-ghcr.io/imdevraj069}/nexora-identity-service:${NEXORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: nexora-identity-service
    restart: unless-stopped
    env_file: .env
    networks:
      - edge-net
      - apps-net
      - messaging-net
      - data-net

  storage-service:
    image: ${NEXORA_REGISTRY:-ghcr.io/imdevraj069}/nexora-storage-service:${NEXORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    container_name: nexora-storage-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - edge-net
      - apps-net
      - storage-net
      - data-net

  worker-service:
    image: ${NEXORA_REGISTRY:-ghcr.io/imdevraj069}/nexora-worker-service:${NEXORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/worker-service/Dockerfile
    container_name: nexora-worker-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - messaging-net
      - storage-net
      - data-net

  ai-governance-service:
    image: ${NEXORA_REGISTRY:-ghcr.io/imdevraj069}/nexora-ai-governance-service:${NEXORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/ai-governance-service/Dockerfile
    container_name: nexora-ai-governance-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - apps-net
      - messaging-net
      - data-net

  gateway-service:
    image: ${NEXORA_REGISTRY:-ghcr.io/imdevraj069}/nexora-gateway-service:${NEXORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: nexora-gateway-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      - identity-service
      - storage-service
      - ai-governance-service
    networks:
      - edge-net
      - apps-net
      - messaging-net
      - data-net

  web:
    image: ${NEXORA_REGISTRY:-ghcr.io/imdevraj069}/nexora-web:${NEXORA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nexora-web
    restart: unless-stopped
    env_file: .env
    depends_on:
      - gateway-service
    networks:
      - edge-net
